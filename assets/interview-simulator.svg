<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Interview Simulator project card">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0C1620"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#C77DFF" stop-opacity="0"/><stop offset=".5" stop-color="#C77DFF" stop-opacity=".30"/><stop offset="1" stop-color="#C77DFF" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="760" height="230" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="758" height="228" rx="18" fill="url(#bg)" stroke="#183342"/>
<rect x="2" y="2" width="756" height="226" rx="17" fill="none" stroke="#C77DFF" stroke-opacity=".22">
<animate attributeName="stroke-opacity" values=".15;.65;.15" dur="3.2s" repeatCount="indefinite"/>
</rect>
<g clip-path="url(#clip)">
<rect x="-300" y="0" width="230" height="230" fill="url(#shine)" transform="skewX(-18)">
<animate attributeName="x" from="-300" to="900" dur="5s" repeatCount="indefinite"/>
</rect>
</g>
<circle cx="42" cy="43" r="9" fill="#C77DFF" filter="url(#glow)">
<animate attributeName="r" values="8;12;8" dur="2.2s" repeatCount="indefinite"/>
</circle>
<text x="68" y="51" fill="#F4F8FA" font-family="ui-monospace,monospace" font-size="27" font-weight="700">Interview Simulator</text>
<text x="38" y="94" fill="#B7C4CD" font-family="Arial,sans-serif" font-size="16">Real-time collaborative coding interview platform</text>
<text x="38" y="128" fill="#C77DFF" font-family="ui-monospace,monospace" font-size="14">WebSockets  •  Redis  •  Docker  •  LangChain</text>
<line x1="38" y1="160" x2="722" y2="160" stroke="#1A303C"/>
<text x="38" y="193" fill="#7E909C" font-family="ui-monospace,monospace" font-size="13">$ interview-simulator --status</text>
<text x="280" y="193" fill="#C77DFF" font-family="ui-monospace,monospace" font-size="13">● building</text>
<text x="622" y="193" fill="#8FA2AE" font-family="ui-monospace,monospace" font-size="13">↗ explore</text>
</svg>